services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kumbuka

  backend:
    image: ghcr.io/tarxemo/kumbuka-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8032:8000"   # Caddy: kumbukabackend.tarxemo.com -> 127.0.0.1:8032
    networks:
      - kumbuka

  frontend:
    image: ghcr.io/tarxemo/kumbuka-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3032:80"     # Caddy: kumbuka.tarxemo.com -> 127.0.0.1:3032
    networks:
      - kumbuka

volumes:
  postgres_data:

networks:
  kumbuka:
    driver: bridge
